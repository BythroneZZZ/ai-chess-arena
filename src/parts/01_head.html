<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AI CHESS ARENA · AI 角色擂台战</title>
<style>
/* ============================================================
   AI CHESS ARENA — pixel UI stylesheet (all inline, zero deps)
   ============================================================ */
@font-face{
  font-family:'PS2P';
  font-style:normal;font-weight:400;font-display:swap;
  src:url(__FONT_PS2P__) format('woff2');
}
@font-face{
  font-family:'FusionPixel';
  font-style:normal;font-weight:400;font-display:swap;
  src:url(__FONT_CJK__) format('woff2');
}

:root{
  --ink:#07060d;
  --bg:#100c1e;
  --bg2:#171130;
  --panel:#241d40;
  --panel2:#2f2754;
  --panel3:#3a3166;
  --line:#6b5fae;
  --line2:#8b7de0;
  --text:#ece8ff;
  --dim:#a79fd2;
  --gold:#ffcc4d;
  --gold2:#ff9f2e;
  --red:#ff4d6d;
  --cyan:#4de1ff;
  --green:#63e6a0;
  --violet:#b07bff;
  --pink:#ff8ad8;
  --sq-light:#c2b9e4;
  --sq-dark:#4d4477;
  --frame:#33285c;
  --frame2:#7b67c9;
  --fs:15px;
  --shadow:4px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 50% -10%, #2a1f52 0%, rgba(0,0,0,0) 55%),
    repeating-linear-gradient(0deg,#0d0a1a 0 3px,#0b0816 3px 6px),
    var(--bg);
  color:var(--text);
  font-family:'FusionPixel',"Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:var(--fs);
  line-height:1.5;
  -webkit-font-smoothing:none;
  font-smooth:never;
  text-rendering:optimizeSpeed;
  image-rendering:pixelated;
  overflow:hidden;
  letter-spacing:.02em;
}
body::after{ /* CRT scanlines */
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:multiply;opacity:.55;
}
body::before{ /* vignette */
  content:'';position:fixed;inset:0;pointer-events:none;z-index:8999;
  box-shadow:inset 0 0 180px rgba(0,0,0,.85);
}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
::selection{background:var(--gold);color:#1a1024}

/* ---------- scrollbars ---------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:#150f2a;border:2px solid #0a0714}
*::-webkit-scrollbar-thumb{background:#4a3d7d;border:2px solid #0a0714}
*::-webkit-scrollbar-thumb:hover{background:var(--line2)}

/* ---------- pixel primitives ---------- */
.px{
  position:relative;
  background:var(--panel);
  border:3px solid var(--ink);
  box-shadow:
    inset 0 0 0 3px var(--panel3),
    inset 0 0 0 6px var(--ink),
    6px 6px 0 rgba(0,0,0,.55);
}
.px.flat{box-shadow:inset 0 0 0 3px var(--panel3),inset 0 0 0 6px var(--ink)}
.px::before{ /* corner rivets */
  content:'';position:absolute;inset:-3px;pointer-events:none;
  background:
    linear-gradient(var(--gold),var(--gold)) left 2px top 2px/6px 6px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right 2px top 2px/6px 6px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left 2px bottom 2px/6px 6px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right 2px bottom 2px/6px 6px no-repeat;
  opacity:.55;
}
.px.plain::before{display:none}

.en{font-family:'PS2P','FusionPixel',monospace;letter-spacing:.04em;line-height:1.6}

.px-btn{
  font-family:'FusionPixel',sans-serif;
  font-size:14px;color:var(--text);
  background:linear-gradient(180deg,var(--panel2),#1e1936 60%,#171230);
  border:3px solid var(--ink);
  box-shadow:inset 0 0 0 3px #4a3f7a,0 4px 0 var(--ink),0 8px 12px rgba(0,0,0,.5);
  padding:9px 14px 8px;
  cursor:pointer;
  position:relative;
  text-shadow:2px 2px 0 #0a0714;
  transition:filter .06s steps(1),transform .06s steps(1);
  user-select:none;
  white-space:nowrap;
}
.px-btn:hover{filter:brightness(1.28)}
.px-btn:active{transform:translateY(4px);box-shadow:inset 0 0 0 3px #4a3f7a,0 0 0 var(--ink),0 2px 6px rgba(0,0,0,.6)}
.px-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.px-btn[disabled]{filter:grayscale(.85) brightness(.62);cursor:not-allowed;transform:none}
.px-btn.gold{background:linear-gradient(180deg,#ffd97a,#f0a92c 55%,#c47a16);color:#281500;text-shadow:2px 2px 0 rgba(255,255,255,.35)}
.px-btn.danger{background:linear-gradient(180deg,#ff7d95,#d92b4c 60%,#8f1430);color:#fff0f3}
.px-btn.cyan{background:linear-gradient(180deg,#8bf0ff,#2aa5c9 60%,#146c8a);color:#04222b}
.px-btn.green{background:linear-gradient(180deg,#a6ffcd,#2fbe76 60%,#147a48);color:#00200f}
.px-btn.small{font-size:13px;padding:7px 10px 6px;text-shadow:1px 1px 0 #0a0714;box-shadow:inset 0 0 0 2px #4a3f7a,0 3px 0 var(--ink)}
.px-btn{text-shadow:1px 1px 0 #0a0714}
.px-btn.gold{text-shadow:1px 1px 0 rgba(255,255,255,.4)}
.px-btn.wide{width:100%;justify-content:center;text-align:center}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;padding:4px 8px 3px;color:var(--text);
  background:#2a2249;border:2px solid var(--ink);
  box-shadow:inset 0 0 0 2px #4f4385;
  cursor:pointer;user-select:none;
}
.chip:hover{filter:brightness(1.2)}
.chip.on{background:linear-gradient(180deg,#6a54c9,#3d2f86);box-shadow:inset 0 0 0 2px var(--gold);color:#fff}
.chip.lock{opacity:.45;cursor:not-allowed}

.field{
  width:100%;font-family:'FusionPixel',monospace;font-size:14px;color:var(--text);
  background:#140f27;border:3px solid var(--ink);
  box-shadow:inset 0 0 0 2px #3b3166;
  padding:8px 10px;outline:none;image-rendering:pixelated;
}
.field:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.field::placeholder{color:#6a6193}
textarea.field{resize:vertical;line-height:1.5;min-height:96px}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 13px) 16px,calc(100% - 8px) 16px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
input[type=range].field{padding:0;height:22px;background:#140f27;box-shadow:none;border:3px solid var(--ink);appearance:none}
input[type=range].field::-webkit-slider-thumb{appearance:none;width:14px;height:18px;background:var(--gold);border:2px solid var(--ink);box-shadow:0 0 0 2px #7a5f1e inset;cursor:pointer}
label.lab{display:block;font-size:12px;color:var(--dim);margin:0 0 4px;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.hr{height:3px;background:repeating-linear-gradient(90deg,#4a3d7d 0 6px,#241d40 6px 12px);border:0;margin:12px 0}

/* ---------- undo / draw confirm ---------- */
.ca-modal{border-color:var(--violet)}
.ca-modal h3{color:var(--violet)}
.ca-body{display:flex;gap:12px;align-items:flex-start}
.ca-portrait{
  flex:0 0 auto;padding:5px;background:linear-gradient(180deg,#2b2350,#171130);
  border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #514594,4px 4px 0 rgba(0,0,0,.5);
}
#caPortrait{width:72px;height:72px;image-rendering:pixelated;display:block}
.ca-speech{flex:1;min-width:0}
.ca-name{font-family:'PS2P',monospace;font-size:9px;color:var(--dim);margin-bottom:6px;letter-spacing:.06em}
.ca-bubble{
  position:relative;padding:10px 12px;min-height:56px;
  background:#efeaff;color:#1a1330;font-size:12.5px;line-height:1.65;
  border:3px solid var(--ink);
  box-shadow:inset -3px -3px 0 #b9aee6,inset 3px 3px 0 #fff,4px 4px 0 rgba(0,0,0,.5);
  word-break:break-word;
}
.ca-bubble::before{
  content:'';position:absolute;left:-11px;top:16px;width:8px;height:8px;
  background:#efeaff;border-left:3px solid var(--ink);border-top:3px solid var(--ink);
  transform:rotate(-45deg);
}
.ca-bubble .caret{display:inline-block;width:7px;height:11px;background:currentColor;margin-left:2px;animation:blink .6s steps(1) infinite;vertical-align:-1px}

/* 已撤销的棋步 */
.mv.undone{opacity:.42;text-decoration:line-through;background:#221b3d;box-shadow:inset 0 -2px 0 #6b5fae}
.mv.undone::after{content:'↺';margin-left:3px;font-size:8px}

@media(max-width:520px){
  .ca-portrait{display:none}
  .ca-bubble{font-size:12px}
}

/* ---------- opening name / hint ---------- */
.opening-name{
  font-size:11.5px;color:#9c92c8;max-width:260px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:2px 0;opacity:.95;
}
.opening-name:empty{display:none}
.opening-name .eco{
  font-family:'PS2P',monospace;font-size:8px;color:var(--gold);
  margin-right:5px;
}
.hint-arrow{
  position:absolute;pointer-events:none;z-index:6;
  width:0;height:0;border-style:solid;
  filter:drop-shadow(0 0 6px rgba(77,225,255,.9));
}
@media(max-width:1000px){ .opening-name{max-width:150px;font-size:10.5px} }

/* ---------- clock ---------- */
.clock{
  font-family:'PS2P',monospace;font-size:15px;letter-spacing:.06em;
  padding:7px 14px 6px;min-width:104px;text-align:center;
  color:#9c92c8;background:#140f27;
  border:3px solid var(--ink);
  box-shadow:inset 0 0 0 2px #3b3166,3px 3px 0 rgba(0,0,0,.5);
  transition:color .1s steps(1);
}
.clock.active{
  color:#0c0716;background:var(--gold);
  box-shadow:inset 0 0 0 2px #ffe9a8,3px 3px 0 rgba(0,0,0,.5),0 0 18px rgba(255,204,77,.55);
}
.clock.low{color:#ff8fa3;animation:clockPulse .9s steps(2) infinite}
.clock.active.low{color:#3a0008;background:#ff6b81;box-shadow:inset 0 0 0 2px #ffc2cc,3px 3px 0 rgba(0,0,0,.5)}
@keyframes clockPulse{50%{opacity:.55}}
@media(max-width:1000px){
  .clock{font-size:13px;padding:5px 9px;min-width:82px}
}
@media(max-width:380px){
  .clock{font-size:11px;padding:4px 6px;min-width:64px}
}

/* ---------- endpoint confirm ---------- */
.ep-origin{
  font-family:'PS2P',monospace;font-size:11px;line-height:1.7;
  padding:10px 12px;word-break:break-all;text-align:center;
  color:var(--gold);background:#140f27;
  border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3b3166;
}
#endpointModal .modal{border-color:#ff9f2e}
#endpointModal h3{color:var(--gold)}

/* ---------- eval bar (P1) ---------- */
/* 布局注意：.eval-col 的宽度必须由 canvas 决定。
 * 数字牌曾用 min-width:100%，结果它的内容把整列撑到 55px（canvas 只有 16px），
 * 窄屏下棋盘行因此溢出。现在数字牌固定不参与横向伸缩，窄屏干脆移到状态条。 */
.board-row{display:flex;align-items:stretch;gap:8px;position:relative;max-width:100%;min-width:0}
.eval-col{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:4px;background:#0e0a1c;
  border:3px solid var(--ink);
  box-shadow:inset 0 0 0 2px #3b3166,4px 4px 0 rgba(0,0,0,.55);
  align-self:flex-start;flex:0 0 auto;
}
.eval-col.off{display:none}
#evalCanvas{display:block;image-rendering:pixelated}
.eval-num{
  font-size:9px;letter-spacing:0;color:#cfc6f0;
  padding:2px 0 1px;background:#171130;border:2px solid var(--ink);
  box-shadow:inset 0 0 0 2px #2f2754;
  width:100%;text-align:center;white-space:nowrap;overflow:hidden;
}
.eval-num.up{color:var(--gold)}
.eval-num.down{color:var(--cyan)}
/* 窄屏：状态条里的行内评估值（宽屏隐藏） */
.eval-inline{
  display:none;font-family:'PS2P',monospace;font-size:9px;
  padding:4px 7px 3px;background:#1a1430;border:2px solid var(--ink);
  box-shadow:inset 0 0 0 2px #3b3166;color:#cfc6f0;letter-spacing:.02em;
}
.eval-inline.up{color:var(--gold)}
.eval-inline.down{color:var(--cyan)}
@media(max-width:1000px){
  .board-row{gap:6px;width:100%;justify-content:center}
  .eval-col{padding:3px}
  .eval-num{display:none}
  .eval-inline{display:inline-block}
}
@media(max-width:380px){
  .board-row{gap:3px}
  .eval-col{padding:2px;box-shadow:inset 0 0 0 1px #3b3166,2px 2px 0 rgba(0,0,0,.55)}
  .eval-inline{font-size:8px;padding:3px 5px 2px}
}

/* ---------- review report (P2) ---------- */
.review-bar{
  width:120px;height:10px;background:#0d0918;border:2px solid var(--ink);
  box-shadow:inset 0 0 0 2px #352b5e;position:relative;overflow:hidden;
  opacity:.35;transition:opacity .1s steps(1);
}
.review-bar.on{opacity:1}
.review-bar.wide{width:100%;max-width:420px;margin:10px auto 0;display:none}
.review-bar.wide.on{display:block}
.review-bar-fill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:repeating-linear-gradient(90deg,var(--cyan) 0 4px,#2b9fc4 4px 8px);
  transition:width .2s steps(6);
}
.rv-list{gap:4px;max-height:180px;overflow-y:auto}
.rv-row{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:4px 6px;background:#221b3d;border:2px solid var(--ink);
  box-shadow:inset 0 0 0 2px #3f356f;font-size:11px;
}
.rv-row:hover{filter:brightness(1.18)}
.rv-row.blunder{box-shadow:inset 0 0 0 2px var(--red)}
.rv-row.mistake{box-shadow:inset 0 0 0 2px var(--orange,#ff9f2e)}
.rv-row.inaccuracy{box-shadow:inset 0 0 0 2px var(--gold)}
.rv-tag{font-family:'PS2P',monospace;font-size:8px;min-width:16px;text-align:center}
.rv-row.blunder .rv-tag{color:var(--red)}
.rv-row.mistake .rv-tag{color:#ff9f2e}
.rv-row.inaccuracy .rv-tag{color:var(--gold)}
.rv-mv{flex:1;min-width:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-loss{font-family:'PS2P',monospace;font-size:8px;color:#a79fd2}
.rv-blunder{color:var(--red)}
.rv-mistake{color:#ff9f2e}
.rv-inacc{color:var(--gold)}
.rv-now{
  margin-top:6px;font-size:11px;padding:3px 0;color:#7d74a6;
  border-top:2px dotted #3b3166;
}
.rv-now.blunder{color:var(--red)}
.rv-now.mistake{color:#ff9f2e}
.rv-now.inaccuracy{color:var(--gold)}
.rv-now.good{color:var(--green)}

/* ---------- keyboard hint (P3) ---------- */
.kbd-hint{
  font-size:10.5px;color:#6f668f;letter-spacing:.02em;
  text-align:center;max-width:100%;line-height:1.5;
}
@media(max-width:520px){ .kbd-hint{font-size:9.5px} }
@media(max-width:380px){ .kbd-hint{display:none} }

/* ---------- 320px 触控与排版专项 ----------
 * 目标不是「塞得下」，而是「手指能点准」：
 *   · 一切可点击元素 ≥ 32px（WCAG 2.5.5 AAA 是 44，AA 无硬性值；
 *     本项目按 32 取，兼顾像素风格的信息密度）
 *   · 字符卡删除键、标签 chip、步进按钮这些原本 10~29px 的一律抬到 32
 *   · 文字不裁切到不可读（ellipsis 保留，但字号不低于 10px）
 * 只在 ≤380px 生效，桌面观感不受影响。 */
@media(max-width:380px){
  /* 通用按钮：抬到底线之上 */
  .px-btn.small{
    min-height:32px;
    font-size:11px;
    padding:6px 7px 5px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .px-btn{min-height:34px}

  /* 角色卡：头像缩一点，把宽度让给文字 */
  .char-card{padding:8px;gap:8px;min-height:96px}
  .char-card .ava{width:52px;height:52px;flex:0 0 52px}
  .char-card .nm{font-size:13px}
  .char-card .tg{font-size:10px}
  .char-card .quote{font-size:10.5px}
  /* 删除键原来只有 10×12，手指根本点不到 */
  .char-card .del{
    width:32px;height:32px;right:0;top:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;line-height:1;
  }

  /* 标签 chip：原来 45×29 */
  .chip{min-height:32px;padding:6px 8px 5px;font-size:11px}
  .tag-legend{gap:5px}

  /* 输入控件统一 34px 高，避免 iOS 聚焦缩放（字号 ≥16 才不触发） */
  .field{font-size:14px;min-height:34px;padding:7px 9px}
  textarea.field{min-height:72px}
  select.field{background-position:calc(100% - 12px) 20px,calc(100% - 7px) 20px}

  /* 回放步进按钮：|&lt; &lt; &gt; &gt;| 原来 30×33 */
  #rpFirst,#rpPrev,#rpNext,#rpLast,#rpPlay{min-width:34px;min-height:34px}

  /* 列表行与统计行收紧留白，但不缩字号 */
  .list-row{padding:7px 8px}
  .list-row .nm{font-size:12.5px}
  .list-row .sub{font-size:10.5px}
  .stat-line{font-size:10.5px}

  /* 复盘卡片：关键片段列表别撑高整页 */
  .rv-list{max-height:140px}
  .rv-row{padding:5px 5px;font-size:10.5px}
  .rv-tag{font-size:7px;min-width:14px}
  .rv-loss{font-size:7px}

  /* 顶栏按钮换行时也别挤成一条 */
  .topbar{gap:5px}
  .topbar h2{font-size:15px}

  /* 9px 的小字在 320px 屏上是真的读不了（PS2P 像素字体尤甚）。
   * 这些是「角标 / 实时数值」类文本：模式卡标签、延迟毫秒数、温度值。
   *
   * 优先级陷阱：.mode-card .ico 的原始定义在文件更靠后（~493 行），
   * 同优先级下后写者胜 —— 所以在媒体查询里必须用更具体的选择器
   * （#app .mode-card .ico）才能压过它。同理适用于 .kbd。 */
  .mono{font-size:10px;letter-spacing:0}
  #lblDelay,#lblTemp,#lblTempL,#lblTempR{font-size:10px}
  #app .mode-card .ico{font-size:10px;letter-spacing:.04em;padding:4px 6px 3px}
  #app .mode-card .num{font-size:20px}
  #app .home-foot .kbd,#app .kbd{font-size:10px}

  /* 复选框原生只有 13×13，手指点不准。
   * 把它做到 24×24，并把所在 label 行撑到 44px 可点高度 ——
   * 整行都是热区（点文字也能切换），这比硬把方块放大到 32 更符合像素风。 */
  input[type=checkbox]{
    width:24px;height:24px;min-width:24px;min-height:24px;
    accent-color:var(--gold);cursor:pointer;
    flex:0 0 auto;
  }
  label:has(> input[type=checkbox]),.row:has(input[type=checkbox]){
    min-height:44px;align-items:center;cursor:pointer;
  }

  /* 暂停按钮是方形图标键（文本只有 II），横向被压到 28px。
   * 给个方形下限，别让它比其它按钮窄。 */
  #btnPause,#btnNext{min-width:34px;min-height:34px;padding:6px 4px 5px}

  /* 面板内边距 */
  .panel-pad{padding:10px}
  .panel-title{font-size:10px;margin-bottom:8px}
}

/* ---------- accessibility ---------- */
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
canvas:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
.px-btn:focus-visible,.chip:focus-visible,.field:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* reduced motion: 关掉一切循环/位移动画 */
body.reduced-motion *,
body.reduced-motion *::before,
body.reduced-motion *::after{
  animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important;scroll-behavior:auto!important;
}
body.reduced-motion #boardFrame.shake{animation:none!important}
body.reduced-motion .portrait-wrap.win canvas,
body.reduced-motion .portrait-wrap.lose canvas{animation:none!important}

/* high contrast: 抬高对比、加粗边框 */
body.high-contrast{
  --text:#ffffff;--dim:#ded6ff;--panel:#241d40;--panel3:#4a3f7a;
  --line2:#b9a8ff;--gold:#ffe066;
}
body.high-contrast .hint{color:#c9c0ea}
body.high-contrast .px-btn{box-shadow:inset 0 0 0 3px #6b5cae,0 4px 0 #000,0 0 0 2px #ffe066}
body.high-contrast .bubble{box-shadow:inset -3px -3px 0 #8f82c4,inset 3px 3px 0 #fff,0 0 0 3px #000}
body.high-contrast .logscroll{border-color:#b9a8ff}

/* ---------- emoji-safe stacks (pixel fonts lack emoji glyphs) ---------- */
.emoji,.topbar h2,.px-btn,.mode-card .ico,.char-card .del,.toast,.stat-line b{
  font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","FusionPixel","Microsoft YaHei",sans-serif;
}
.topbar h2,.px-btn,.mode-card .ico{font-feature-settings:normal}
/* 中文/拉丁仍走像素字体，emoji 单独回退 */
.topbar h2{font-family:"Segoe UI Emoji","Apple Color Emoji","FusionPixel",sans-serif}
.px-btn{font-family:"Segoe UI Emoji","Apple Color Emoji","FusionPixel",sans-serif}

/* ---------- screens ---------- */
#app{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:center}
.screen{
  display:none;flex-direction:column;width:100%;height:100%;
  padding:14px 16px;overflow:auto;align-items:center;
}
.screen.on{display:flex;animation:screenIn .18s steps(3)}
#screen-battle.on,#screen-replay.on{justify-content:center}
@keyframes screenIn{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- title ---------- */
.logo-wrap{text-align:center;margin:2vh 0 1vh}
.logo{
  font-family:'PS2P',monospace;font-size:clamp(20px,3.4vw,40px);line-height:1.4;
  color:#fff;
  text-shadow:
    3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),
    6px 6px 0 var(--violet),9px 9px 0 rgba(0,0,0,.6);
  letter-spacing:.06em;
}
.logo em{font-style:normal;color:var(--gold);text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),6px 6px 0 #a1501a}
.sub-logo{margin-top:14px;color:var(--dim);font-size:14px;letter-spacing:.28em}
.badge{display:inline-block;font-family:'PS2P',monospace;font-size:10px;color:#0c0716;background:var(--gold);padding:4px 8px 3px;box-shadow:3px 3px 0 var(--ink)}

.home-grid{display:grid;grid-template-columns:repeat(2,minmax(240px,340px));gap:18px;margin:2vh 0}
.mode-card{
  cursor:pointer;padding:18px 16px;background:linear-gradient(180deg,#2c2452,#1c1638);
  border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #4b3f80,8px 8px 0 rgba(0,0,0,.5);
  text-align:left;transition:transform .07s steps(1),filter .07s steps(1);
  position:relative;overflow:hidden;
}
.mode-card:hover{transform:translate(-2px,-2px);filter:brightness(1.16)}
.mode-card:active{transform:translate(2px,2px)}
.mode-card h3{font-size:17px;margin-bottom:6px;color:#fff;text-shadow:2px 2px 0 #0a0714}
.mode-card p{font-size:12.5px;color:var(--dim);line-height:1.6}
.mode-card .num{position:absolute;right:8px;top:6px;font-family:'PS2P',monospace;font-size:26px;color:#3b2f6e;text-shadow:2px 2px 0 #0a0714}
.mode-card .ico{
  display:inline-block;margin-bottom:8px;padding:3px 7px 2px;
  font-family:'PS2P',monospace;font-size:9px;letter-spacing:.08em;
  color:#0c0716;background:var(--gold);box-shadow:3px 3px 0 rgba(0,0,0,.55);
}

.home-foot{color:#6f668f;font-size:12px;text-align:center;margin-top:auto;padding-top:16px}

/* ---------- generic panel headers ---------- */
.shell{width:100%;max-width:1240px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:18px;letter-spacing:.08em;text-shadow:3px 3px 0 #0a0714;display:flex;align-items:center;gap:8px}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:7px 12px;font-size:13px;cursor:pointer;background:#221b3d;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3f356f;color:var(--dim)}
.tab.on{background:linear-gradient(180deg,#5d49b8,#382b7c);box-shadow:inset 0 0 0 2px var(--gold);color:#fff}

/* ---------- character / api lists ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;width:100%}
.char-card{
  display:flex;gap:12px;padding:12px;background:linear-gradient(180deg,#2a2249,#1b1533);
  border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #443a76,5px 5px 0 rgba(0,0,0,.45);
  cursor:pointer;position:relative;min-height:118px;
  transition:transform .07s steps(1),filter .07s steps(1);
}
.char-card:hover{filter:brightness(1.16);transform:translate(-2px,-2px)}
.char-card:active{transform:translate(1px,1px)}
.char-card.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 2px var(--gold),5px 5px 0 rgba(0,0,0,.45)}
.char-card .ava{width:64px;height:64px;flex:0 0 64px;background:#0e0a1c;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3d3369;image-rendering:pixelated}
.char-card .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.char-card .nm{font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 #0a0714}
.char-card .tg{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-card .quote{font-size:11.5px;color:#b9aee6;font-style:italic;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-card .badge2{position:absolute;right:6px;bottom:6px;font-family:'PS2P',monospace;font-size:8px;padding:3px 5px 2px;background:#3f356f;color:#cfc6f0;box-shadow:2px 2px 0 #0a0714}
.char-card .del{position:absolute;right:4px;top:2px;font-size:12px;color:#8b7fc0;background:none;border:0;cursor:pointer;line-height:1}
.char-card .del:hover{color:var(--red)}
.card-grid.empty{display:block}

.list-row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#221b3d;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3f356f;cursor:pointer}
.list-row:hover{filter:brightness(1.14)}
.list-row.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 2px var(--gold)}
.list-row .nm{font-size:13.5px}
.list-row .sub{font-size:11px;color:var(--dim)}
.dot{width:8px;height:8px;background:#4b3f80;box-shadow:0 0 0 2px #0a0714}
.dot.ok{background:var(--green);box-shadow:0 0 0 2px #0a0714,0 0 10px var(--green)}

/* ---------- setup ---------- */
.setup-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:880px){.setup-cols{grid-template-columns:1fr}}
.panel-pad{padding:14px}
.panel-title{font-family:'PS2P',monospace;font-size:11px;color:var(--gold);margin-bottom:10px;letter-spacing:.06em}

/* ---------- avatars & portrait ---------- */
.ava-lg{width:96px;height:96px;background:#0e0a1c;border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #4a3f7a,5px 5px 0 rgba(0,0,0,.5);image-rendering:pixelated}
.portrait-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.p-ava-box{position:relative;padding:8px;background:linear-gradient(180deg,#2b2350,#171130);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #514594,7px 7px 0 rgba(0,0,0,.5)}
.p-ava-box::after{content:'';position:absolute;inset:5px;border:2px dashed rgba(140,126,220,.35);pointer-events:none}
#portraitL,#portraitR{width:150px;height:150px;image-rendering:pixelated}
.p-name{font-family:'PS2P',monospace;font-size:10px;text-align:center;color:#fff;text-shadow:2px 2px 0 #0a0714;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-tags{font-size:11px;color:var(--dim);text-align:center;max-width:190px;min-height:16px}

/* morale bar */
.morale{width:100%;max-width:190px}
.morale .lab{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}
.morale .bar{height:12px;background:#0d0918;border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #352b5e;position:relative;overflow:hidden}
.morale .fill{position:absolute;left:0;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,var(--green) 0 6px,#3fbf85 6px 10px);transition:width .25s steps(4)}
.morale.b .fill{background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,#2b9fc4 6px 10px)}

/* ---------- speech bubble ---------- */
.bubble{
  position:relative;width:100%;max-width:250px;min-height:74px;
  padding:10px 12px;background:#efeaff;color:#1a1330;
  border:3px solid var(--ink);
  box-shadow:inset -3px -3px 0 #b9aee6,inset 3px 3px 0 #fff,6px 6px 0 rgba(0,0,0,.5);
  font-size:12.5px;line-height:1.65;
  word-break:break-word;
}
.bubble::before{content:'';position:absolute;top:-13px;left:26px;width:8px;height:8px;background:#efeaff;border-left:3px solid var(--ink);border-top:3px solid var(--ink)}
.bubble::after{content:'';position:absolute;top:-7px;left:32px;width:14px;height:6px;background:#efeaff;border-top:3px solid var(--ink);border-right:3px solid var(--ink);transform:rotate(-20deg)}
.bubble .who{display:block;font-size:10px;color:#6b5fa8;margin-bottom:2px;letter-spacing:.06em}
.bubble.think{background:#181228;color:#cfc6f0;border-color:#0a0714;box-shadow:inset -3px -3px 0 #2b2350,inset 3px 3px 0 #3a3166,6px 6px 0 rgba(0,0,0,.5)}
.bubble .caret{display:inline-block;width:7px;height:11px;background:currentColor;margin-left:2px;animation:blink .6s steps(1) infinite;vertical-align:-1px}
@keyframes blink{50%{opacity:0}}
.bubble.pop{animation:popIn .14s steps(2)}
@keyframes popIn{from{transform:scale(.86)}to{transform:scale(1)}}

/* ---------- board ---------- */
.battle{
  display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);
  gap:14px;align-items:start;justify-content:center;width:100%;max-width:1320px;
  margin:auto 0;
}
.board-col{display:flex;flex-direction:column;align-items:center;gap:8px}
#boardFrame{position:relative;padding:12px;background:
  linear-gradient(180deg,#493a86,#2b2250 55%,#1d1740);
  border:4px solid var(--ink);
  box-shadow:inset 0 0 0 4px #6a58b8,inset 0 0 0 8px #241c47,10px 10px 0 rgba(0,0,0,.6),0 0 60px rgba(120,90,255,.25);
}
#boardFrame::before{
  content:'';position:absolute;inset:-4px;pointer-events:none;
  background:
    linear-gradient(var(--gold),var(--gold)) left 0 top 0/14px 6px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right 0 top 0/14px 6px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left 0 bottom 0/14px 6px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right 0 bottom 0/14px 6px no-repeat;
  opacity:.9;
}
#boardFrame.shake{animation:shake .28s steps(2) 2}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
  50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,2px)}100%{transform:translate(0,0)}
}
#boardCanvas{cursor:pointer;touch-action:manipulation}
#checkFlash{position:fixed;inset:0;pointer-events:none;z-index:8000;opacity:0;box-shadow:inset 0 0 140px 30px rgba(255,40,80,.75)}
#checkFlash.on{animation:flashRed .5s steps(2) 3}
@keyframes flashRed{0%,100%{opacity:0}50%{opacity:1}}
#promoOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,5,18,.82);z-index:5}
#promoOverlay.on{display:flex}
.promo-box{display:flex;gap:10px;padding:12px;background:var(--panel);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px var(--panel3)}
.promo-box canvas{width:56px;height:56px;cursor:pointer;background:#b9b0dd;border:3px solid var(--ink)}
.promo-box canvas:hover{filter:brightness(1.2)}

/* status strip under board */
.status-strip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);min-height:26px;flex-wrap:wrap;justify-content:center}
.turn-pill{font-family:'PS2P',monospace;font-size:10px;padding:5px 9px 4px;background:#2a2249;border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #4b3f80;color:#fff}
.turn-pill.w{color:var(--gold)}
.turn-pill.b{color:var(--cyan)}
.think-dots i{display:inline-block;width:6px;height:6px;background:var(--gold);margin-right:3px;animation:think 1s steps(1) infinite}
.think-dots i:nth-child(2){animation-delay:.2s}.think-dots i:nth-child(3){animation-delay:.4s}
@keyframes think{0%,100%{opacity:.25}50%{opacity:1}}


/* ---------- victory / defeat pixel anims ---------- */
@keyframes pixJump{
  0%,100%{transform:translateY(0)}
  25%{transform:translateY(-10px)}
  50%{transform:translateY(0)}
  70%{transform:translateY(-6px)}
}
@keyframes pixCry{
  0%,100%{transform:translateY(6px) scaleY(.94)}
  50%{transform:translateY(8px) scaleY(.90)}
}
@keyframes pixShake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-4px,1px)}
  40%{transform:translate(4px,-1px)}
  60%{transform:translate(-3px,2px)}
  80%{transform:translate(3px,-2px)}
}
.portrait-wrap.win #portraitL,.portrait-wrap.win #portraitR{animation:pixJump .55s steps(3) infinite}
.portrait-wrap.win .p-ava-box{box-shadow:inset 0 0 0 3px #514594,7px 7px 0 rgba(0,0,0,.5),0 0 32px rgba(255,204,77,.65)}
.portrait-wrap.lose #portraitL,.portrait-wrap.lose #portraitR{animation:pixCry .9s steps(2) infinite}
.portrait-wrap.lose .p-ava-box{filter:saturate(.45) brightness(.8)}
.portrait-wrap.shake #portraitL,.portrait-wrap.shake #portraitR{animation:pixShake .3s steps(2) 2}
.tear{position:absolute;width:4px;height:8px;background:#7fd8ff;box-shadow:0 0 6px #7fd8ff;left:50%;top:52%;opacity:0}
.portrait-wrap.lose .tear{animation:tearDrop 1.1s steps(4) infinite}
@keyframes tearDrop{
  0%{opacity:0;transform:translateY(0)}
  20%{opacity:1}
  100%{opacity:0;transform:translateY(38px)}
}
/* ---------- very narrow (<=380px): compact toolbar ---------- */
@media(max-width:380px){
  #screen-battle .topbar{gap:4px;margin-bottom:0}
  #screen-battle .topbar .px-btn.small{
    font-size:10px;padding:4px 5px 3px;
    box-shadow:inset 0 0 0 2px #4a3f7a,0 2px 0 var(--ink);
  }
  #screen-battle .topbar #battleModeLabel{display:none}
  #screen-battle .portrait-wrap{gap:6px}
  #sideLWrap,#sideRWrap{padding:0}
  .p-ava-box{padding:3px}
  #portraitL,#portraitR{width:40px;height:40px}
  .morale{max-width:70px;flex:0 0 70px}
  .morale .lab{font-size:9px}
  .bubble{font-size:11px;padding:6px 8px}
  .status-strip{font-size:10px;gap:4px;min-height:20px}
  .turn-pill{font-size:8px;padding:3px 6px}
  .logbar{gap:4px}
  .mv{font-size:8px;padding:3px 4px}
}

/* ---------- responsive battle ---------- */
@media(max-width:1000px){
  .battle{grid-template-columns:1fr;gap:8px;max-width:100%}
  #sideLWrap{order:1;width:100%;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-start}
  .board-col{order:2}
  #sideRWrap{order:3;width:100%;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-start}
  #portraitL,#portraitR{width:64px;height:64px}
  .p-ava-box{padding:5px;box-shadow:inset 0 0 0 2px #514594,4px 4px 0 rgba(0,0,0,.5)}
  .p-name{font-size:9px;max-width:120px}
  .p-tags{font-size:10px;max-width:120px;min-height:0}
  .morale{max-width:120px;flex:0 0 120px}
  .bubble{max-width:none;flex:1 1 200px;min-height:0;font-size:12px;padding:8px 10px;box-shadow:inset -2px -2px 0 #b9aee6,inset 2px 2px 0 #fff,4px 4px 0 rgba(0,0,0,.5)}
  .bubble::before,.bubble::after{display:none}
  .screen{padding:10px 8px}
  .battle{max-width:none}
}
@media(max-width:520px){
  :root{--fs:14px}
  .topbar{gap:6px}
  .px-btn.small{font-size:12px;padding:6px 8px 5px}
  .brand-row .logo{font-size:18px}
  #portraitL,#portraitR{width:52px;height:52px}
  .bubble{flex-basis:150px;font-size:11.5px;line-height:1.5}
  .p-tags{display:none}
  .morale{max-width:90px;flex:0 0 90px}
  .home-grid{grid-template-columns:1fr;gap:12px;width:100%}
  .mode-card{padding:12px}
  .mode-card h3{font-size:15px}
  .mode-card p{font-size:11.5px}
  .modal{width:96vw;padding:12px}
  .char-card{flex-wrap:wrap}
  .result-quotes{grid-template-columns:1fr}
  .setup-cols{grid-template-columns:1fr!important}
  .status-strip{font-size:11px;gap:6px}
  .move-log{font-size:9px}
  .replay-wrap{grid-template-columns:1fr}
}
/* ---------- move log ---------- */
.logbar{width:100%;max-width:1180px;display:flex;align-items:center;gap:8px}
.logscroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;display:flex;gap:6px;padding:6px 4px;background:#150f2a;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #302658;min-height:42px;align-items:center;scrollbar-width:thin}
.mv{font-family:'PS2P',monospace;font-size:9px;padding:4px 6px 3px;background:#2a2249;border:2px solid #0a0714;color:#d8d2ff;flex:0 0 auto}
.mv.w{box-shadow:inset 0 -2px 0 var(--gold)}
.mv.b{box-shadow:inset 0 -2px 0 var(--cyan)}
.mv.cap{background:#4a2242}
.mv.chk{background:#5a1f2c;color:#ffd0d8}
.log-empty{color:#5f5686;font-size:12px;padding-left:4px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,4,14,.78);display:none;align-items:center;justify-content:center;z-index:8500;padding:18px}
.modal-bg.on{display:flex}
.modal{width:min(560px,96vw);max-height:88vh;overflow:auto;padding:16px;background:linear-gradient(180deg,#2c2452,#1a1433);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px #514594,10px 10px 0 rgba(0,0,0,.6)}
.modal h3{font-size:16px;margin-bottom:10px;color:var(--gold);text-shadow:2px 2px 0 #0a0714}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:8px 14px;background:#241d40;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #4b3f80,4px 4px 0 rgba(0,0,0,.6);font-size:12.5px;color:#fff;animation:toastIn .14s steps(2)}
.toast.bad{box-shadow:inset 0 0 0 2px var(--red),4px 4px 0 rgba(0,0,0,.6)}
.toast.good{box-shadow:inset 0 0 0 2px var(--green),4px 4px 0 rgba(0,0,0,.6)}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* ---------- result overlay ---------- */
#resultOverlay{position:fixed;inset:0;z-index:8600;display:none;align-items:center;justify-content:center;background:rgba(5,3,12,.86);padding:16px}
#resultOverlay.on{display:flex}
.result-box{width:min(660px,96vw);padding:18px;text-align:center;background:linear-gradient(180deg,#332a5f,#181230);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px #5c4da8,0 0 80px rgba(160,120,255,.3),10px 10px 0 rgba(0,0,0,.6)}
.result-title{font-family:'PS2P',monospace;font-size:clamp(16px,2.4vw,26px);color:var(--gold);text-shadow:3px 3px 0 #0a0714,6px 6px 0 #7a3a10;margin:6px 0 4px}
.result-sub{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.result-quotes{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-bottom:12px}
@media(max-width:620px){.result-quotes{grid-template-columns:1fr}}
.quote-card{padding:10px;background:#1c1636;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #443a76;font-size:12.5px;line-height:1.65;color:#ddd6ff;min-height:70px}
.quote-card b{display:block;color:var(--gold);font-size:11px;margin-bottom:4px;letter-spacing:.06em}

/* ---------- replay ---------- */
.replay-wrap{display:grid;grid-template-columns:auto 320px;gap:16px;align-items:start;justify-content:center;width:100%;max-width:1100px}
@media(max-width:900px){.replay-wrap{grid-template-columns:1fr}}
.replay-side{display:flex;flex-direction:column;gap:10px;min-height:0}
/* 回放页复用了 battle 的 .board-col 类，而那条规则里有 order:2（战斗页用来
 * 把棋盘排在两个立绘中间）。单列布局下不回置就会把棋盘推到信息栏后面 ——
 * 320px 实测棋盘落到 y=846，整屏看不见。这里显式复位。 */
.replay-wrap .board-col{order:0}
.replay-wrap .replay-side{order:0}

/* ---------- misc ---------- */
.hint{font-size:11.5px;color:#7d74a6;line-height:1.6}
.kbd{font-family:'PS2P',monospace;font-size:9px;padding:2px 4px;background:#2a2249;border:2px solid #0a0714}
.flex1{flex:1}
.hidden{display:none!important}
.center{text-align:center}
.mono{font-family:'PS2P',monospace}
.tag-legend{display:flex;flex-wrap:wrap;gap:6px}
.stat-line{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.scroll-y{overflow-y:auto;min-height:0}
.err{color:var(--red);font-size:11.5px;word-break:break-all}
.ok{color:var(--green);font-size:11.5px;word-break:break-all}
</style>
</head>
